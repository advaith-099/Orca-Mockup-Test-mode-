<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORCA – prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* STYLES. Colours are set once in :root (light mode) and again in [data-theme="dark"] (dark mode). Every colour in the page uses these variables, so switching mode changes everything at once. Sections below: layout, cards, buttons, tables, forms, steps, dashboard, events, side panel. */
:root{color-scheme:light;--bg:#f4f6fb;--bg2:#e9eef7;--card:rgba(255,255,255,.86);--solid:#ffffff;--ink:#0b1222;--ink2:#334155;--mute:#64748b;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.15);
--accent:#0f766e;--accent2:#14b8a6;--accent-soft:#d9f5f1;--on-accent:#ffffff;--onAccentRing:rgba(15,118,110,.35);
--ok:#047857;--okb:#d1fae5;--warn:#92400e;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--tint:#f8fafc;
--shadow:0 1px 2px rgba(15,23,42,.05),0 22px 44px -26px rgba(15,23,42,.28);
--topA:#0b1222;--topB:#16263d;--glow1:#c9ecf1;--glow2:#dfe6fb;--c1:#0f9a6c;--c2:#e3a82b;--c3:#14a9c2;--c4:#7f93a6;--c5:#cf5f50}
:root[data-theme="dark"]{color-scheme:dark;--bg:#070d19;--bg2:#0c1628;--card:rgba(17,26,44,.78);--solid:#111a2c;--ink:#e6edf7;--ink2:#c3cfe0;--mute:#8a9ab3;--line:rgba(148,163,184,.13);--line2:rgba(148,163,184,.24);
--accent:#2dd4bf;--accent2:#5eead4;--accent-soft:rgba(45,212,191,.14);--on-accent:#04211d;--onAccentRing:rgba(45,212,191,.35);
--ok:#34d399;--okb:rgba(52,211,153,.14);--warn:#fbbf24;--warnb:rgba(251,191,36,.14);--bad:#f87171;--badb:rgba(248,113,113,.14);--tint:rgba(148,163,184,.06);
--shadow:0 1px 2px rgba(0,0,0,.4),0 24px 48px -28px rgba(0,0,0,.7);
--topA:#050a14;--topB:#0b1424;--glow1:#0f2a3a;--glow2:#1b1d3d;--c1:#34d399;--c2:#fbbf24;--c3:#22d3ee;--c4:#94a3b8;--c5:#f87171}
*{box-sizing:border-box}
body{margin:0;font:400 14.5px/1.5 Figtree,system-ui,-apple-system,sans-serif;color:var(--ink);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;
background:radial-gradient(1000px 600px at -5% -10%,var(--glow1) 0%,transparent 60%),radial-gradient(900px 560px at 105% 0%,var(--glow2) 0%,transparent 55%),var(--bg);transition:background .3s,color .3s}
.top{display:flex;align-items:center;gap:16px;padding:0 24px;height:62px;background:linear-gradient(110deg,var(--topA),var(--topB));color:#e8f4f8;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-weight:800;font-size:16px;letter-spacing:5px;display:flex;align-items:center;gap:10px}
.logo:before{content:"";width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 0 18px rgba(45,212,191,.45)}
.ev{color:#8ea9b8;font-size:13px}
.test{background:rgba(251,191,36,.14);color:#fcd683;border:1px solid rgba(251,191,36,.3);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600}
#rolebar{margin-left:auto;display:flex;align-items:center;gap:12px}
.role{display:flex;gap:10px;align-items:center;font-size:12px;color:#8ea9b8}
.top .seg{background:rgba(255,255,255,.08)}
.top .seg button{color:#a9c0cc}
.top .seg button.on{background:#fff;color:#0b1222}
.theme{font:600 12.5px Figtree,system-ui,sans-serif;color:#dbe7ee;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:6px 12px;cursor:pointer}
.theme:hover{background:rgba(255,255,255,.14)}
.shell{display:flex;height:calc(100vh - 62px)}
#nav{width:240px;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line);overflow:auto;padding:18px 14px;display:flex;flex-direction:column}
#nav h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:20px 12px 6px;font-weight:700}
#nav h3:first-child{margin-top:0}
#nav button{display:flex;width:100%;align-items:center;text-align:left;border:0;background:none;padding:9px 12px;margin:2px 0;font:500 14px Figtree,system-ui,sans-serif;cursor:pointer;color:var(--ink2);border-radius:11px;transition:background .15s,color .15s}
#nav button:hover{background:var(--accent-soft)}
#nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.navfoot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.navfoot .me{display:flex;align-items:center;gap:10px;padding:6px 10px 12px}
.navfoot .av{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.navfoot .mn1{font-weight:700;font-size:13.5px}
.navfoot .so{display:block;width:100%;border:1px solid var(--line2);background:var(--solid);border-radius:11px;padding:8px 12px;font:600 13.5px Figtree,system-ui,sans-serif;color:var(--ink2);cursor:pointer;text-align:center}
.navfoot .so:hover{background:var(--tint)}
#main{flex:1;overflow:auto;padding:30px 42px 80px}
#main h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0 18px}
.seg{display:inline-flex;background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;color:var(--mute);font:600 13px Figtree,system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:var(--shadow)}
.box,.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:24px 26px;margin-bottom:18px;box-shadow:var(--shadow)}
.how{background:var(--accent-soft);border-color:transparent;color:var(--ink2);font-size:14px;box-shadow:none;display:flex;gap:12px;align-items:flex-start}
.how:before{content:"i";flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:800 12px/22px Figtree,sans-serif;text-align:center;margin-top:1px}
.how b{color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stat{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.num{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:8px;color:var(--ink)}
.sub{font-size:12.5px;color:var(--mute);margin-top:5px}
.small{font-size:13px;color:var(--mute)}
.h2{font-size:15.5px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
button.b,button.p,button.d{font:600 14px Figtree,system-ui,sans-serif;border-radius:12px;padding:9px 18px;border:1px solid var(--line2);background:var(--solid);color:var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s;box-shadow:0 1px 2px rgba(15,23,42,.06)}
button.b:hover{background:var(--tint)}
button.p{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:transparent;color:var(--on-accent);box-shadow:0 8px 18px -10px var(--onAccentRing)}
button.d{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:not(:disabled):hover{transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
button.lock{opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--onAccentRing);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);border-radius:99px;padding:3px 11px;margin:2px;background:var(--solid);cursor:pointer;color:var(--ink2);white-space:nowrap}
.chip .c{color:var(--mute);font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .c{color:var(--mute)}
.chip.g{background:var(--okb);border-color:transparent;color:var(--ok);cursor:default}
.chip.a{background:var(--warnb);border-color:transparent;color:var(--warn);cursor:default}
.chip.r{background:var(--badb);border-color:transparent;color:var(--bad);cursor:default}
.chip.bl{background:var(--accent-soft);border-color:transparent;color:var(--accent);cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);padding:11px 10px;border-bottom:1px solid var(--line2)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;border-top:1px solid var(--line2)}
.tblwrap{max-height:540px;overflow:auto}
.tblwrap th{position:sticky;top:0;background:var(--solid);z-index:1}
input,select,textarea{font:inherit;padding:10px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--solid);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:100px;resize:vertical;line-height:1.55}
label{font-size:13.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:9px}
label input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.drop{border:1.5px dashed var(--onAccentRing);background:var(--accent-soft);border-radius:18px;padding:48px 18px;text-align:center;color:var(--mute)}
.drop p{margin:6px 0}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin:12px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.bl-row{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:13.5px}
.bl-row .t{width:110px;color:var(--ink2)}
.bl-row .track{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bl-row .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.bl-row .v{width:40px;text-align:right;font-weight:700}
.att{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.iss{border:1px solid var(--line2);border-radius:16px;padding:15px 17px;margin-bottom:10px;background:var(--solid)}
.msg{background:var(--tint);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:9px 0;max-width:80%}
.msg.me{background:var(--accent-soft);border-color:transparent;margin-left:auto}
.photo{display:inline-flex;align-items:center;justify-content:center;width:160px;height:100px;background:linear-gradient(135deg,var(--accent-soft),var(--tint));border-radius:16px;font-size:12.5px;color:var(--mute);cursor:pointer;margin:6px 0;border:1px solid var(--line)}
.preview{background:var(--solid);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.preview p{margin:10px 0}
.mockphoto{height:96px;background:linear-gradient(135deg,var(--accent-soft),var(--tint));border-radius:14px;margin:10px 0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12.5px}
.steps{display:flex;gap:12px;margin:0 0 24px;list-style:none;padding:0;overflow-x:auto}
.steps li{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;padding-top:14px;border-top:3px solid var(--line2);color:var(--mute);font-size:13.5px;font-weight:600}
.steps li[onclick]{cursor:pointer}
.steps .n{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--solid);border:1.5px solid var(--line2);font-size:12.5px;font-weight:800;flex:none}
.steps li.on{border-top-color:var(--accent)}
.steps li.on{color:var(--ink)}
.steps li.on .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps li.done{border-top-color:var(--ok);color:var(--ok)}
.steps li.done .n{background:var(--ok);border-color:var(--ok);color:var(--solid)}
.gi{padding:13px;border-radius:14px;cursor:pointer;margin-bottom:4px}
.gi:hover{background:var(--tint)}
.gi.on{background:var(--solid);box-shadow:var(--shadow)}
.rp{padding:13px;border-radius:14px;cursor:pointer;margin-bottom:4px}
.rp:hover{background:var(--tint)}
.rp.on{background:var(--solid);box-shadow:var(--shadow)}
.addp{background:var(--tint);border:1px solid var(--line2);border-radius:16px;padding:18px;margin:12px 0}
.tint.g{background:var(--okb)}
.tint.b{background:var(--accent-soft)}
.tint.r{background:var(--badb)}
.tint.a{background:var(--warnb)}
.tint{border-radius:16px;padding:16px 18px;margin-top:12px}
.scrim{position:fixed;inset:62px 0 0 0;background:rgba(2,6,23,.35);backdrop-filter:blur(2px);z-index:9}
.pn{position:fixed;top:62px;right:0;bottom:0;width:min(470px,92vw);background:var(--solid);z-index:10;box-shadow:-30px 0 60px -30px rgba(0,0,0,.45);padding:26px 28px;overflow:auto;border-left:1px solid var(--line)}
.pn-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tl{border-left:2px solid var(--line2);margin-left:6px;padding-left:20px}
.tli{position:relative;padding:0 0 16px}
.tli .dot{position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--solid)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:14px;display:none;box-shadow:0 14px 34px rgba(0,0,0,.3);font-size:14px;z-index:20;font-weight:600}
.tick{width:58px;height:58px;border-radius:50%;background:var(--okb);color:var(--ok);display:grid;place-items:center;margin:0 auto;font-size:27px;font-weight:800}
.login{min-height:70vh}
.login .box{border-radius:24px}
.err{color:var(--bad);font-size:13px;margin:8px 0;font-weight:600}
.login a{color:var(--accent);font-size:13px;font-weight:700;text-decoration:none}

.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
#nav button:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line2);margin-right:11px;flex:none}
#nav button.on:before{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stat{position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent));opacity:.9}
.box{transition:box-shadow .2s}
.box:hover{box-shadow:var(--shadow),0 0 0 1px var(--line2) inset}
tr:hover td{background:var(--tint)}

/* dashboard */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 20px}
.hh{margin:0 0 6px!important;font-size:30px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.kpi{padding:20px 22px}
.kicon{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:12px}
.donut{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-top:6px}
.donut svg{flex:none;overflow:visible}
.donut .dn{font:800 30px Figtree,system-ui,sans-serif;fill:var(--ink);text-anchor:middle;letter-spacing:-.03em}
.donut .ds{font:600 11px Figtree,system-ui,sans-serif;fill:var(--mute);text-anchor:middle;text-transform:uppercase;letter-spacing:.1em}
.legend{flex:1;min-width:190px;display:grid;gap:4px}
.lg{display:grid;grid-template-columns:12px 1fr auto 46px;align-items:center;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.lg:last-child{border-bottom:0}
.lg .dot{width:10px;height:10px;border-radius:4px}
.lg .v{font-weight:800}
.lg .pc{color:var(--mute);font-size:12.5px;text-align:right}
.ring{display:flex;align-items:center;gap:22px;margin:12px 0 6px;flex-wrap:wrap}
.ring svg{flex:none;overflow:visible}
.ring .rt{font:800 22px Figtree,system-ui,sans-serif;fill:var(--ink);text-anchor:middle;letter-spacing:-.02em}
.ring .big{font-size:14px;color:var(--ink2);font-weight:600;max-width:240px}
.empty{text-align:center;padding:30px 12px 16px}
.eico{width:54px;height:54px;border-radius:50%;background:var(--okb);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px;font-size:24px;font-weight:800}
.empty b{display:block;font-size:16px;color:var(--ink)}
.empty p{margin:6px auto 0;max-width:340px;color:var(--mute);font-size:13.5px}

.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-bottom:22px}
.ev-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.ev-card.arch{opacity:.7}
.mini{background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mini b{display:block;font-size:20px;margin-top:4px}
.fl{display:flex;flex-direction:column;align-items:stretch;gap:6px;font-size:13px;color:var(--mute);font-weight:600}
.fl input,.fl select,.fl textarea{width:100%}
.evbox{background:var(--accent-soft);border-radius:16px;padding:14px;margin:0 0 12px}
.evname{font-weight:800;font-size:15px;margin-top:2px}
.navfoot .av{font-size:12px}
</style></head>
<body>
<!-- ORCA prototype (full view). Structure: top bar (logo, test mode pill, event name, role and theme switch), sidebar (event, pages, sign out), main area (the current page). Data is saved in the browser. The script at the bottom holds all the logic; each function has a comment above it. -->
<header class="top"><span class="logo">ORCA</span><span class="test" id="testPill">Test mode · no real messages</span><span class="ev">Tech Fest 2026 · 14 Nov</span><span id="rolebar"></span></header>
<div class="shell" id="shellEl"><nav id="nav"></nav><main id="main"></main></div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>
<script>

   status: I Interested, Q Question, U Undecided, D Declined, O Opted out (replied STOP), - no reply yet */

[9,"Nikhil Joseph","Anna University","E","I",0,87,"15:10","Interested. Please share more details.",0,""],
[10,"Karthik Raman","Anna University","B","Q",0,92,"10:40","Is there an entry fee to attend?",0,"fee"],

[12,"Vignesh Kumar","SRM","B","Q",0,88,"12:55","Can I bring a friend along?",0,"friend"],
[13,"Pooja Hegde","Christ University","W","Q",0,85,"15:30","Is accommodation provided for outstation students?",0,"accommodation"],
[14,"Aditya Shah","BITS Pilani","B","U",0,58,"09:50","Maybe, I need to check with my team first.",0,""],
[15,"Ritika Bose","Jadavpur University","B","U",0,55,"17:05","Let me see if my exams allow it.",0,""],

function timeline(r){

 else if(S.camps[0].ids.indexOf(r.id)>=0){

 }

 if(r.st==="O")t.push({when:"Reply · "+r.time,txt:"Replied STOP · opted out"});

var IMPROWS=[["Rahul S.","duplicate of Rahul Sharma","dup","Rahul Sharma"],["Pranav J.","duplicate of Pranav Joshi","dup","Pranav Joshi"],["Lakshmi R.","phone has 9 digits","ph","Lakshmi Rao"],["Tarun Reddy","phone missing","ph","Tarun Reddy"],["Lavanya S.","phone has 11 digits","ph","Lavanya Subramanian"]];

function impIssues(){return IMPROWS.map(function(x,i){return {k:"i"+i,type:x[2],label:x[0],why:x[1],name:x[3]}})}
// Saves a corrected phone number during import. It must have exactly 10 digits.
function fixPhone(k){var v=(($("fx_"+k)||{}).value||"").replace(/\D/g,"");if(v.length!==10){S.imp.fixErr=S.imp.fixErr||{};S.imp.fixErr[k]="A phone number needs exactly 10 digits. This has "+v.length+".";render();return}S.imp.dec[k]="fix";S.imp.fixed=S.imp.fixed||{};S.imp.fixed[k]=v;S.imp.fixErr&&delete S.imp.fixErr[k];logEv("Import","Phone fixed for one row");render();toast("Number saved")}

function impCounts(){
 var iss=impIssues(),merged=0,skipped=0,keep=0,decided=0;
 iss.forEach(function(x){var d=S.imp.dec[x.k];if(!d)return;decided++;if(d==="merge")merged++;else if(d==="skip")skipped++;else keep++});
 var ready=47;
 var imported=ready+keep;
 return {ready:ready,left:iss.length-decided,decided:decided,merged:merged,skipped:skipped,imported:imported};
}

 (S.prog==="fail"?failTable():
 '<div class="box"><div class="row" style="justify-content:space-between"><div><div class="h2" style="font-size:19px;margin:0">'+c.name+'</div><div class="small">'+c.ch+' · '+c.when+'</div></div><div class="row" style="margin:0">'+controls+'</div></div>'+

 return [{key:"all",name:"All contacts",kind:"Smart",rule:"Everyone imported",n:base.length},{key:"interested",name:"Interested participants",kind:"Smart",rule:"Status is Interested",n:base.filter(function(r){return r.st==="I"}).length},{key:"notreplied",name:"Not replied yet",kind:"Smart",rule:"Status is No reply yet",n:base.filter(function(r){return r.st==="-"}).length}].concat(S.groups.map(function(g){return {key:g.key,name:g.name,kind:"Static",rule:"Chosen by hand",n:(S.members[g.key]||[]).filter(function(id){return base.some(function(r){return r.id===id})}).length,owner:g.owner}}))
}
function setStatus(id,v){var r=R(id);if(!guardRow(r))return;if(r.opt){toast("Reverse the opt-out first");return}if(r.st===v)return;if(v==="-"&&r.replied){toast("They have replied, so they can’t go back to No reply yet");return}hist(id,"Status set to "+LABEL[v]+" by "+ME.name+(r.replied?"":" (no reply yet, marked by hand)"));logEv("Status",r.name+" set to "+LABEL[v]+(r.replied?"":" (marked by hand)"));r.st=v;if(v!=="Q")delete S.answered[id];render();toast(r.name+" is now "+LABEL[v])}
function optOut(id){var r=R(id);if(!guardRow(r))return;r.opt=true;hist(id,"Opted out by hand");logEv("Opt-out",r.name+" opted out by hand");render();toast(r.name+" removed from every audience")}
function confirmReverse(id){var r=R(id);if(!guardRow(r))return;var reason=(($("rv")||{}).value||"").trim();if(!reason){S.reverseErr="Write a reason first. It is logged.";render();return}r.opt=false;if(r.st==="O")r.st="U";S.reverseFor=null;hist(id,"Opt-out reversed: "+reason);logEv("Opt-out reversed",r.name+" · "+reason);render();toast("Opt-out reversed. Logged.")}
function answerWith(id,text,topic){var r=R(id);if(!guardRow(r))return;if(!text){toast("Write a reply first");return}S.answered[id]=true;S.answers[id]=text;S.draft="";if(topic)S.sugSent[topic]=(S.sugSent[topic]||0)+1;logEv("Reply sent",r.name+" answered"+(topic?" with approved FAQ":" by hand"));render();toast("Reply sent to "+r.name)}
function confirmAdd(){
 var ids=Object.keys(S.sel).filter(function(k){return S.sel[k]}).map(Number);
 var mine=ids.filter(function(i){return canEdit(R(i).owner)});
 if(ids.length&&mine.length<ids.length)toast((ids.length-mine.length)+" contact(s) belong to someone else and were skipped");
 var ticked=allGroups().filter(function(g){var el=$("g_"+g.key);return el&&el.checked&&g.kind!=="Smart"});
 if(!ticked.length){toast("Tick a group first");return}
 ticked.forEach(function(g){S.members[g.key]=(S.members[g.key]||[]).concat(mine.filter(function(i){return (S.members[g.key]||[]).indexOf(i)<0}))});
 logEv("Group","Added "+mine.length+" people to "+ticked.map(function(g){return g.name}).join(", "));
 S.addOpen=false;S.sel={};render();toast("Added "+mine.length+" people")
}
function excludeSel(){var ids=Object.keys(S.sel).filter(function(k){return S.sel[k]}).map(Number);var mine=ids.filter(function(i){return canEdit(R(i).owner)});if(ids.length&&mine.length<ids.length)toast((ids.length-mine.length)+" contact(s) belong to someone else and were skipped");mine.forEach(function(i){R(i).excl=true});logEv("Exclude","Excluded "+mine.length+" people from campaigns");S.sel={};render();toast("Excluded "+mine.length+" people")}
function selAll(v){rows.forEach(function(r){if(canEdit(r.owner))S.sel[r.id]=v});render()}
function deleteContact(id){var r=R(id);if(!canEdit(r.owner)){toast("Only "+r.owner+" can delete this contact");return}
 rows=rows.filter(function(x){return x.id!==id});S.camps.forEach(function(c){c.ids=c.ids.filter(function(x){return x!==id});c.fails=c.fails.filter(function(x){return x!==id});c.pending=(c.pending||[]).filter(function(x){return x!==id})});
 Object.keys(S.members).forEach(function(k){S.members[k]=S.members[k].filter(function(x){return x!==id})});
 logEv("Delete",r.name+" deleted by "+ME.name);S.cpanel=null;S.cDel=null;render();toast("Contact deleted")}
function openCForm(id){var r=id?R(id):null;if(r&&!guardRow(r))return;S.cForm={id:id||null,name:r?r.name:"",phone:r?digitsPh(r.ph):"",email:r?r.em:"",college:r?r.col:""};S.cFormErr="";S.cpanel=null;render();window.scrollTo&&0}
function saveCForm(){
 var f=S.cForm;var name=(($("cf_name")||{}).value||"").trim(),phone=digitsPh(($("cf_phone")||{}).value),email=(($("cf_email")||{}).value||"").trim(),college=(($("cf_college")||{}).value||"").trim();
 if(!name){S.cFormErr="Name is required.";render();return}
 if(phone.length!==10){S.cFormErr="Phone must have exactly 10 digits (you typed "+phone.length+").";render();return}
 if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){S.cFormErr="That email address doesn’t look right.";render();return}
 var reach=phone&&email?"B":phone?"W":email?"E":"N";
 if(f.id){var r=R(f.id);if(!guardRow(r))return;r.name=name;r.ph="+91 "+phone;r.em=email;r.col=college;r.reach=reach;logEv("Edit",name+" details updated by "+ME.name)}
 else{var nid=rows.reduce(function(m,x){return Math.max(m,x.id)},0)+1;rows.push({replied:false,id:nid,name:name,col:college,reach:reach,st:"-",fail:false,conf:0,time:"",txt:"",photo:false,topic:"",opt:false,excl:false,owner:ME.name,ph:"+91 "+phone,em:email});logEv("Add",name+" added by "+ME.name)}
 S.cForm=null;S.cFormErr="";render();toast("Contact saved")
}

}

 var list=rows.filter(function(r){if(S.ctab==="All")return true;if(S.ctab==="Opted out")return r.opt;if(S.ctab==="No reply yet")return r.st==="-"&&!r.opt;return LABEL[r.st]===S.ctab});

 '<div class="box" style="padding:6px 0 0"><div class="tblwrap"><table><tr><th><input type="checkbox" onchange="selAll(this.checked)"></th><th>Name</th><th>Reach</th><th>Status</th><th>Groups</th><th>Owner</th><th></th></tr>'+
 list.map(function(r){var inG=S.groups.filter(function(g){return (S.members[g.key]||[]).indexOf(r.id)>=0}).map(function(g){return g.name});var mine=canEdit(r.owner);
  return '<tr><td>'+(mine?'<input type="checkbox" '+(S.sel[r.id]?"checked":"")+' onchange="toggleSel('+r.id+')">':'')+'</td><td><b>'+r.name+'</b><div class="small">'+r.col+'</div></td><td><span class="chip '+(r.reach==="N"?"r":r.reach==="B"?"g":"bl")+'">'+REACHTXT[r.reach]+'</span></td><td>'+chipFor(r.opt?"O":r.st)+(r.excl?' <span class="chip">Excluded</span>':'')+'</td><td class="small">'+(inG.length?inG.join(", "):"—")+'</td><td class="small">'+(mine?"You":r.owner)+'</td><td><button class="b" onclick="openPanel('+r.id+')">Open</button></td></tr>'}).join("")+'</table></div></div>'}

function S12(){
 var gs=allGroups();var k=S.gsel||"all";var g=gs.filter(function(x){return x.key===k})[0]||gs[0];

 '<div class="row" style="margin:12px 4px 4px"><input id="newg2" placeholder="New group name" style="flex:1"><button class="b" onclick="newGroup2()">Create</button></div></div>'+

 '<div class="grid" style="margin:16px 0">'+stat("Members",ids.length,"")+stat("Can receive",ids.filter(function(i){var r=R(i);return reachOK(r,null)&&!r.opt}).length,"reachable on a channel")+'</div>'+

 '<table style="margin-top:12px"><tr><th>Name</th><th>College</th><th>Status</th><th>Owner</th></tr>'+ids.slice(0,60).map(function(i){var r=R(i);return '<tr><td><b>'+r.name+'</b></td><td>'+r.col+'</td><td>'+chipFor(r.opt?"O":r.st)+'</td><td class="small">'+r.owner+'</td></tr>'}).join("")+'</table></div></div>'}

function readSheet(file,cb){
 var name=file.name.toLowerCase(),fr=new FileReader();
 if(/\.csv$/.test(name)){fr.onload=function(){cb(null,csvRows(fr.result))};fr.readAsText(file);return}
 if(/\.xlsx?$/.test(name)){
  if(typeof XLSX==="undefined"){cb("Excel reading isn’t available in this preview. Save the file as CSV and upload that instead.");return}
  fr.onload=function(){try{var wb=XLSX.read(fr.result,{type:"array"});var ws=wb.Sheets[wb.SheetNames[0]];cb(null,XLSX.utils.sheet_to_json(ws,{header:1,defval:""}))}catch(err){cb("This file could not be read: "+err.message)}};fr.readAsArrayBuffer(file);return}
 cb("Please upload an Excel (.xlsx) or CSV (.csv) file.");
}
function csvRows(t){return t.split(/\r?\n/).filter(function(l){return l.trim()}).map(function(l){return l.split(",").map(function(c){return c.replace(/^"|"$/g,"").trim()})})}
function mapCols(head){var h=head.map(function(x){return String(x||"").toLowerCase().trim()});function f(re){return h.findIndex(function(x){return re.test(x)})}return {name:f(/^name|full name|participant/),phone:f(/phone|mobile|whatsapp|contact no/),email:f(/mail/),college:f(/college|university|clg|institute/),source:f(/source/)}}
function analyse(table){
 var head=table[0]||[],map=mapCols(head);
 var data=table.slice(1).filter(function(r){return r.some(function(c){return String(c).trim()!==""})});
 var seenPh={},seenEm={};rows.forEach(function(r){if(r.ph)seenPh[digitsPh(r.ph)]=1;if(r.em)seenEm[r.em.toLowerCase()]=1});
 var recs=[];
 data.forEach(function(r,i){
  var rec={line:i+2,name:String(r[map.name]||"").trim(),phone:digitsPh(r[map.phone]),email:String(r[map.email]||"").trim(),college:String(r[map.college]||"").trim(),issue:null,match:""};
  if(!rec.name){rec.issue="name"}
  else if(rec.phone&&seenPh[rec.phone]){rec.issue="dup";rec.match=rows.filter(function(x){return digitsPh(x.ph)===rec.phone})[0]?rows.filter(function(x){return digitsPh(x.ph)===rec.phone})[0].name:"a contact already in this file"}
  else if(rec.email&&seenEm[rec.email.toLowerCase()]){rec.issue="dup";rec.match=rows.filter(function(x){return x.em&&x.em.toLowerCase()===rec.email.toLowerCase()})[0]?rows.filter(function(x){return x.em&&x.em.toLowerCase()===rec.email.toLowerCase()})[0].name:"a contact already in this file"}
  else if(rec.phone.length!==10){rec.issue="ph"}
  if(rec.phone&&!rec.issue)seenPh[rec.phone]=1;if(rec.email&&!rec.issue)seenEm[rec.email.toLowerCase()]=1;
  recs.push(rec);
 });
 var issues=[];recs.forEach(function(rec,i){if(rec.issue)issues.push({k:"i"+i,rec:rec})});
 return {total:data.length,map:map,recs:recs,issues:issues,cols:head.filter(function(x){return String(x).trim()}).length};
}
function fileLoaded(f){
 S.imp.file={name:f.name,total:0};S.imp.error="";S.imp.dec={};S.imp.fixed={};S.imp.consent=false;
 readSheet(f,function(err,table){
  if(err){S.imp.file=null;S.imp.error=err;render();return}
  if(!table.length){S.imp.file=null;S.imp.error="The file is empty.";render();return}
  var a=analyse(table);S.imp.file={name:f.name,total:a.total,cols:a.cols,map:a.map};S.imp.recs=a.recs;S.imp.issues=a.issues;
  render();
 });
}

function impCounts(){
 var iss=impIssues(),total=S.imp.file?S.imp.file.total:0,merged=0,skipped=0,keep=0,decided=0;
 iss.forEach(function(x){var d=S.imp.dec[x.k];if(!d)return;decided++;if(d==="merge")merged++;else if(d==="skip")skipped++;else keep++});
 var ready=total-iss.length;

}

  rows.push(r);added.push(nid);nid++;

 (S.camps.length?'<div class="box"><table><tr><th>Campaign</th><th>Owner</th><th>Channels</th><th>People</th><th>Delivered</th><th>Failed</th><th>Queued</th><th>Status</th><th></th></tr>'+
 S.camps.map(function(c){var st=c.state==="done"?"Done":c.state==="paused"?"Paused":c.state==="stopped"?"Stopped":"Sending";var cls=st==="Done"?"":st==="Sending"?"g":"a";var mine=canEdit(c.owner);
  return '<tr><td style="cursor:pointer" onclick="S.prog=\''+c.id+'\';go(\'S11\')"><b>'+c.name+'</b><div class="small">'+c.when+'</div></td><td class="small">'+(c.owner||"")+'</td><td><span class="chip bl">'+c.ch+'</span></td><td>'+c.ids.length+'</td><td>'+cDel(c)+'</td><td>'+c.fails.length+'</td><td>'+(c.pending||[]).length+'</td><td><span class="chip '+cls+'">'+st+'</span></td><td>'+(mine?(S.campDel===c.id?'<button class="d" onclick="deleteCamp(\''+c.id+'\')">Confirm</button>':'<button class="b" onclick="S.campDel=\''+c.id+'\';render()">Delete</button>'):'')+'</td></tr>'}).join("")+'</table></div>':'<div class="box">'+empty("No campaigns yet","Start one with New campaign: Audience, then Message, then Check and send.")+'</div>')}
function deleteCamp(id){var c=S.camps.filter(function(x){return x.id===id})[0];if(!canEdit(c.owner)){toast("Only "+c.owner+" can delete this campaign");return}S.camps=S.camps.filter(function(x){return x.id!==id});S.campDel=null;logEv("Delete","Campaign “"+c.name+"” deleted by "+ME.name);render();toast("Campaign deleted")}
function sendNow(){
 var r=audStats(S.aud,S.ch);var ids=r.receive.map(function(x){return x.id});
 S.camps.push({id:"C"+Date.now(),name:audLabel(S.aud),ch:S.ch,ids:ids,fails:[],pending:ids.slice(),state:"sending",when:"now",owner:ME.name});
 logEv("Send",ids.length+" messages queued · "+audLabel(S.aud)+" · "+S.ch);
 S.aud=null;S.ch=null;S.checked=false;S.typed="";S.sendI=0;S.prog=S.camps[S.camps.length-1].id;go("S11");toast("Campaign queued (test mode)");
}
function togglePause(cid){var c=S.camps.filter(function(x){return x.id===cid})[0];if(!canEdit(c.owner)){toast("Only "+c.owner+" can change this campaign");return}if(c.state==="sending"){c.state="paused";toast("Paused")}else if(c.state==="paused"){c.state="sending";toast("Resumed")}render()}
function advance(cid,n){var c=S.camps.filter(function(x){return x.id===cid})[0];if(!c||!canEdit(c.owner)){toast("Only "+(c?c.owner:"the owner")+" can send this campaign");return}if(c.state==="paused"||c.state==="stopped"||c.state==="done")return;var take=c.pending.splice(0,n);if(!take.length){c.state="done";render();return}logEv("Send",take.length+" messages sent · "+c.name);if(!c.pending.length){c.state="done";logEv("Done",c.name+" finished")}render();toast(take.length+" messages sent")}
function stopCamp(cid){var c=S.camps.filter(function(x){return x.id===cid})[0];if(!canEdit(c.owner)){toast("Only "+c.owner+" can stop this campaign");return}var left=c.pending.length;c.pending=[];c.state="stopped";logEv("Stop",c.name+" stopped. "+left+" not sent.");render();toast("Stopped. "+left+" not sent")}

/* ---------- FAQ: one document per event, edit and delete every entry ---------- */
function S14(){
 var coord=isC();
 var entries=S.faq;
 return '<h1>FAQ & auto-reply</h1>'+
 '<div class="grid" style="margin-bottom:16px">'+stat("Approved",entries.filter(function(f){return f.status==="Approved"}).length,"ready to suggest")+stat("Drafts",entries.filter(function(f){return f.status!=="Approved"}).length,"need approval")+stat("Sent from FAQ",Object.keys(S.sugSent).reduce(function(a,k){return a+S.sugSent[k]},0),"times")+'</div>'+
 '<div class="box"><div class="row" style="justify-content:space-between"><div><div class="h2" style="margin:0">Event FAQ document</div><div class="small">'+(S.faqDoc?S.faqDoc.name+' · '+S.faqDoc.count+' questions · uploaded '+S.faqDoc.when:'No document uploaded for this event yet')+'</div></div>'+
 (coord?'<label class="b" style="cursor:pointer">Upload document<input type="file" accept=".xlsx,.csv" style="display:none" onchange="if(this.files[0])faqDocUpload(this.files[0])"></label>':'<span class="chip">Coordinators only</span>')+'</div>'+
 '<p class="small" style="margin-top:10px">Upload an Excel or CSV file with the columns <b>Question</b> and <b>Answer</b>. Each upload replaces the previous document’s questions. Word and PDF files can’t be read in this demo.</p>'+(S.faqErr?'<div class="err">'+S.faqErr+'</div>':'')+'</div>'+
 '<div class="box"><div class="h2">Add a question and answer</div><div class="row"><input id="fq" placeholder="Question" style="flex:1"></div><div class="row"><textarea id="fa" style="min-height:64px" placeholder="Answer (official information only)"></textarea></div><div class="row" style="justify-content:space-between"><span class="small">Saved as a draft. Only a coordinator can approve it.</span><button class="p" onclick="addFaq()">Save as draft</button></div></div>'+
 '<div class="box"><table><tr><th>Question</th><th>Answer</th><th>Source</th><th>Status</th><th>Used</th><th></th></tr>'+entries.map(function(f){
   var mine=f.source==="site"?(canEdit(f.owner)):coord;
   if(S.faqEdit===f.id)return '<tr><td colspan="6"><div class="row"><input id="eq_'+f.id+'" value="'+f.q.replace(/"/g,"&quot;")+'" style="flex:1"></div><div class="row"><textarea id="ea_'+f.id+'" style="min-height:56px">'+f.a+'</textarea></div><div class="row" style="justify-content:flex-end"><button class="b" onclick="S.faqEdit=null;render()">Cancel</button><button class="p" onclick="saveFaq(\''+f.id+'\')">Save</button></div></td></tr>';
   return '<tr><td><b>'+f.q+'</b></td><td class="small">'+f.a+'</td><td><span class="chip">'+(f.source==="doc"?"Document":"Added on site")+'</span></td><td>'+(f.status==="Approved"?'<span class="chip g">Approved</span>':'<span class="chip">Draft</span>')+'</td><td>'+(f.topic&&S.sugSent[f.topic]?S.sugSent[f.topic]:0)+'</td><td class="row" style="margin:0;justify-content:flex-end">'+
    (f.status!=="Approved"?'<button class="b '+(coord?"":"lock")+'" '+(coord?"":"disabled")+' onclick="approveFaq(\''+f.id+'\')">Approve</button>':'')+
    '<button class="b"'+(mine?"":" disabled")+' onclick="S.faqEdit=\''+f.id+'\';render()">Edit</button>'+
    (S.faqDel===f.id?'<button class="d" onclick="deleteFaq(\''+f.id+'\')">Confirm</button>':'<button class="b"'+(mine?"":" disabled")+' onclick="S.faqDel=\''+f.id+'\';render()">Delete</button>')+'</td></tr>'}).join("")+'</table>'+
 '<div class="small" style="margin-top:10px">'+(coord?"You can approve answers.":"Only coordinators approve answers. You can edit and delete the answers you added.")+'</div></div>'+
 '<div class="box"><div class="h2">Auto-reply</div><div class="small">Off by default. When off, ORCA only suggests approved answers and you press Approve and send.</div><div class="row"><button class="'+(coord?"p":"b lock")+'" '+(coord?"":"disabled")+' onclick="toggleAuto()">'+(S.auto?"Switch off":"Switch on")+'</button><span class="chip '+(S.auto?"g":"")+'">'+(S.auto?"On":"Off")+'</span>'+(coord?"":'<span class="small">Coordinators only</span>')+'</div></div>';
}
function faqDocUpload(f){readSheet(f,function(err,table){if(err){S.faqErr=err;render();return}
 var h=(table[0]||[]).map(function(x){return String(x).toLowerCase()});var qi=h.findIndex(function(x){return /question/.test(x)}),ai=h.findIndex(function(x){return /answer/.test(x)});
 if(qi<0||ai<0){S.faqErr="The file needs a Question column and an Answer column.";render();return}
 var add=table.slice(1).filter(function(r){return String(r[qi]||"").trim()}).map(function(r,i){return {id:"d"+Date.now()+"_"+i,q:String(r[qi]).trim(),a:String(r[ai]||"").trim(),topic:"",status:"Draft",source:"doc",owner:"document"}});
 S.faq=S.faq.filter(function(x){return x.source!=="doc"}).concat(add);S.faqDoc={name:f.name,count:add.length,when:"today"};S.faqErr="";logEv("FAQ","Document “"+f.name+"” uploaded: "+add.length+" questions");render();toast(add.length+" questions loaded from the document")})}
function addFaq(){var q=($("fq").value||"").trim(),a=($("fa").value||"").trim();if(!q||!a){toast("Add both a question and an answer");return}S.faq.push({id:"s"+Date.now(),q:q,a:a,topic:"",status:"Draft",source:"site",owner:ME.name});logEv("FAQ","Draft added by "+ME.name+": "+q);render();toast("Saved as draft")}
function canEditFaq(f){return f.source==="site"?canEdit(f.owner):isC()}
function saveFaq(id){var f=S.faq.filter(function(x){return x.id===id})[0];if(!canEditFaq(f)){toast("You can’t change this entry");return}var q=($("eq_"+id).value||"").trim(),a=($("ea_"+id).value||"").trim();if(!q||!a){toast("Question and answer can’t be empty");return}f.q=q;f.a=a;S.faqEdit=null;logEv("FAQ","Entry edited: "+q);render();toast("Saved")}
function approveFaq(id){if(!isC()){toast("Only coordinators can approve");return}var f=S.faq.filter(function(x){return x.id===id})[0];f.status="Approved";logEv("FAQ","Approved for use: "+f.q);render();toast("Approved")}
function deleteFaq(id){var f=S.faq.filter(function(x){return x.id===id})[0];if(!canEditFaq(f)){toast("You can’t delete this entry");return}S.faq=S.faq.filter(function(x){return x.id!==id});S.faqDel=null;logEv("FAQ","Entry deleted: "+f.q);render();toast("Deleted")}

// SCREENS 3 AND SHELL: settings pages (event setup, team, channels), the sidebar, render, and startup (boot).
/* ---------- settings ---------- */
function S16(){var e=evById(ACTIVE);return '<h1>Event setup</h1>'+'<div class="box"><div class="two">'+[["Event name",e.name],["Date",e.date],["Time zone",e.tz],["Registration link",e.link]].map(function(x){return '<div><div class="lbl">'+x[0]+'</div><div style="font-weight:700;margin-top:4px">'+x[1]+'</div></div>'}).join("")+'</div><div class="small" style="margin-top:14px">'+e.desc+'</div><div class="row" style="margin-top:14px">'+(isC()?'<button class="b" onclick="evEdit(\''+e.id+'\');go(\'S0\')">Edit on the Events page</button>':'<span class="chip">Only coordinators can edit event details</span>')+'</div></div>'+
 '<div class="box"><div class="h2">Quiet hours</div><div class="small">No messages are sent between 9 PM and 8 AM.</div></div>'}
function S17(){
 var f=S.userForm;
 return '<h1>Team</h1>'+'<div class="box"><div class="row" style="justify-content:space-between"><div class="small">'+USERS.length+' people in ORCA. Each one signs in with their own account.</div>'+(isC()?'<button class="p" onclick="S.userForm={id:null,name:\'\',email:\'\',role:\'Volunteer\'};render()">+ Add person</button>':'<span class="chip">Coordinators only</span>')+'</div>'+
 '<table style="margin-top:10px"><tr><th>Name</th><th>Email</th><th>Role</th><th>Contacts in '+evById(ACTIVE).name+'</th><th></th></tr>'+USERS.map(function(u,i){var n=rows.filter(function(r){return r.owner===u.name}).length;return '<tr><td><b>'+u.name+'</b>'+(ME&&ME.email===u.email?' <span class="chip">You</span>':'')+'</td><td class="small">'+u.email+'</td><td>'+(isC()?'<select onchange="setUserRole('+i+',this.value)">'+["Volunteer","Coordinator"].map(function(r){return '<option '+(u.role===r?"selected":"")+'>'+r+'</option>'}).join("")+'</select>':u.role)+'</td><td>'+n+'</td><td class="row" style="margin:0;justify-content:flex-end">'+(isC()?'<button class="b" onclick="S.userForm={id:'+i+',name:\''+u.name+'\',email:\''+u.email+'\',role:\''+u.role+'\'};render()">Edit</button>'+(S.userDel===i?'<button class="d" onclick="deleteUser('+i+')">Confirm</button>':'<button class="b" onclick="S.userDel='+i+';render()" '+(ME&&ME.email===u.email?"disabled":"")+'>Delete</button>'):'')+'</td></tr>'}).join("")+'</table></div>'+
 (f?'<div class="box"><div class="h2">'+(f.id!==null?"Edit person":"Add a person")+'</div><div class="two"><label class="fl">Name<input id="u_name" value="'+f.name+'"></label><label class="fl">Email<input id="u_email" value="'+f.email+'"></label><label class="fl">Role<select id="u_role">'+["Volunteer","Coordinator"].map(function(r){return '<option '+(f.role===r?"selected":"")+'>'+r+'</option>'}).join("")+'</select></label></div><div class="row" style="justify-content:flex-end"><button class="b" onclick="S.userForm=null;render()">Cancel</button><button class="p" onclick="saveUser()">Save</button></div></div>':'')+
 '<div class="box"><div class="h2">What each role can do</div><div class="two"><div><div class="lbl">Volunteer</div><p class="small" style="margin-top:8px">See every event and all of its data. Import, message and reply, and change only the contacts and replies they own.</p></div><div><div class="lbl">Coordinator</div><p class="small" style="margin-top:8px">Everything a volunteer does, plus add, edit and delete events, manage the team, approve FAQ answers, switch auto-reply on, and change any contact.</p></div></div></div>'}
function setUserRole(i,v){var u=USERS[i];u.role=v;if(ME&&ME.email===u.email){ME.role=v;S.role=v}logEv("Team",u.name+" is now "+v);render();toast(u.name+" is now "+v)}
function saveUser(){var n=(($("u_name")||{}).value||"").trim(),e=(($("u_email")||{}).value||"").trim(),r=(($("u_role")||{}).value||"Volunteer");if(!n||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){toast("Enter a name and a valid email");return}var f=S.userForm;if(f.id!==null){var u=USERS[f.id];u.name=n;u.email=e;u.role=r}else USERS.push({name:n,email:e,role:r});S.userForm=null;render();toast("Saved")}
function deleteUser(i){var u=USERS[i];if(ME&&ME.email===u.email){toast("You can’t delete your own account");return}USERS.splice(i,1);S.userDel=null;render();toast("Removed "+u.name)}
function S18(){return '<h1>Channels & privacy</h1>'+'<div class="two"><div class="box"><div class="h2">Channels</div><div class="row" style="justify-content:space-between"><b>WhatsApp</b><span class="chip g">Mock · active</span></div><div class="row" style="justify-content:space-between"><b>Email</b><span class="chip g">Mock · active</span></div><div class="row" style="margin-top:14px"><label><input type="checkbox" '+(S.testMode!==false?"checked":"")+' '+(isC()?"":"disabled")+' onchange="S.testMode=this.checked;render()"> Test mode (banner on every page)</label></div><div class="small">Speed limit: 60 messages a minute. Real providers are not connected until Phase 5.</div></div>'+
 '<div class="box"><div class="h2">Data retention</div><div class="small">Contact data is kept for 12 months after the event (open decision). Opted-out people stay on the do-not-contact list.</div></div></div>'}

/* ---------- shell ---------- */
function sectionOf(v){return {S0:"Events",S2:"Overview",S3:"Contacts",S4:"Contacts",S5:"Contacts",S6:"Contacts",S7:"Campaigns",S8:"Campaigns",S9:"Campaigns",S10:"Campaigns",S11:"Campaigns",S12:"Organise",S13:"Replies",S14:"Replies",S15:"Organise",S16:"Settings",S17:"Settings",S18:"Settings"}[v]||""}
function nav(){
 var ev=evById(ACTIVE);
 var top='<button class="'+(S.view==="S0"?"on":"")+'" onclick="go(\'S0\')">All events</button>';
 var G=[];
 if(ev)G=[["Overview",[["S2","Dashboard"]]],["Contacts",[["S3","Contacts"],["S4","Import Excel"]]],["Campaigns",[["S7","All campaigns"],["S8","New campaign"]]],["Replies",[["S13","Inbox"],["S14","FAQ & auto-reply"]]],["Organise",[["S12","Groups"],["S15","Activity log"]]],["Settings",[["S16","Event setup"],["S17","Team"],["S18","Channels & privacy"]]]];
 var box=ev?'<div class="evbox"><div class="small">Working in</div><div class="evname">'+ev.name+'</div><button class="b" style="width:100%;margin-top:8px" onclick="go(\'S0\')">Change event</button></div>':'';
 $("nav").innerHTML=box+'<h3>Events</h3>'+top+G.map(function(g){return "<h3>"+g[0]+"</h3>"+g[1].map(function(x){return '<button class="'+(S.view===x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+"</button>"}).join("")}).join("")+
 '<div class="navfoot"><div class="me"><span class="av">'+ME.name.split(" ").map(function(p){return p[0]}).join("").slice(0,2)+'</span><div><div class="mn1">'+ME.name+'</div><div class="small">'+ME.role+'</div></div></div><button class="so" onclick="signOut()">Sign out</button></div>';
}
function panelOverlay(){var r=S.cpanel?R(S.cpanel):null;return r?'<div class="scrim" onclick="closePanel()"></div><aside class="pn">'+panelHTML(r)+'</aside>':""}
var SCREENS={S0:S0,S1:S1,S2:S2,S3:S3,S4:S4,S5:S5,S6:S6,S7:S7,S8:S8,S9:S9,S10:S10,S11:S11,S12:S12,S13:S13,S14:S14,S15:S15,S16:S16,S17:S17,S18:S18};
function render(){
 var m=$("main"),keep=m.scrollTop,inApp=!!(S.loggedIn&&ME);
 if(inApp&&!ACTIVE&&S.view!=="S0"&&S.view!=="S17"&&S.view!=="S18")S.view="S0";
 if(inApp&&ACTIVE)TEAM_PEOPLE=computeTeam();
 $("testPill").style.display=S.testMode===false?"none":"";
 var ev=inApp&&ACTIVE?evById(ACTIVE):null;
 document.querySelector(".ev").textContent=ev?(ev.name+" · "+ev.date):"";
 $("rolebar").innerHTML=(inApp?roleSeg():"")+'<button class="theme" onclick="toggleTheme()" title="Switch light and dark">'+(S.dark?"☀ Light":"☾ Dark")+'</button>';
 if(inApp)nav();else $("nav").innerHTML="";
 $("nav").style.display=inApp?"":"none";
 m.style.padding=inApp?"":"0";
 m.innerHTML=(inApp&&S.view!=="S0"&&ACTIVE?'<div class="eyebrow">'+sectionOf(S.view)+'</div>':'')+(!inApp?S1:(SCREENS[S.view]||S0))();
 m.scrollTop=keep;
 $("overlay").innerHTML=(inApp&&S.view==="S3")?panelOverlay():"";
 persist();
}
function toggleTheme(){S.dark=!S.dark;document.documentElement.setAttribute('data-theme',S.dark?'dark':'light');render()}
/* ---------- start ---------- */
boot();
render();

</script></body></html>
